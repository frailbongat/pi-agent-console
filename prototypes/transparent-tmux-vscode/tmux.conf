# THROWAWAY PROTOTYPE — not production configuration.
# Private tmux fabric for the Agent Console wayfinding prototype.

# tmux is transport, never UI.
set -g status off
set -g prefix None
set -g prefix2 None
# VS Code maps wheel events to arrows while tmux owns the outer alternate screen
# unless tmux requests mouse input. Capture the wheel so it enters pane history.
set -g mouse on
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

# Preserve the server and live Agent processes when the only client disappears.
set -g exit-unattached off
set -g destroy-unattached off
set -g detach-on-destroy off
set -g remain-on-exit on

# Pi's documented tmux requirements for modified keys.
set -g extended-keys on
set -g extended-keys-format csi-u
set -s escape-time 10

# Describe VS Code/xterm.js capabilities to tmux explicitly.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:256:RGB:clipboard:extkeys:focus:hyperlinks:title'

# VS Code reports modifiers with Kitty CSI-u, while tmux 3.7b only negotiates
# xterm modifyOtherKeys. Reuse tmux's outer extended-key lifecycle to set
# Kitty's disambiguate-only mode; tmux already parses those simple CSI-u keys.
# "set" (CSI =) is idempotent when tmux refreshes terminal features repeatedly.
set -as terminal-overrides ',xterm*:Eneks=\E[=1u:Dseks=\E[=0u'
set -g focus-events on

# Let visible panes use terminal passthrough, but never let a detached Agent emit
# passthrough sequences into whichever client happens to be attached elsewhere.
set -g allow-passthrough on

# VS Code did not reliably accept tmux's automatic OSC 52 after mouse copies.
# On this macOS prototype, copy drag selections explicitly, then leave copy mode
# so the next paste reaches Pi. Agent Console's own OSC 52 uses DCS passthrough.
set -s set-clipboard off
bind-key -T copy-mode MouseDragEnd1Pane "send-keys -X copy-pipe /usr/bin/pbcopy; send-keys -X cancel"
bind-key -T copy-mode-vi MouseDragEnd1Pane "send-keys -X copy-pipe /usr/bin/pbcopy; send-keys -X cancel"

# Mirror Pi's pane title into the VS Code integrated-terminal title.
set -g allow-set-title on
set -g allow-rename off
set -g set-titles on
set -g set-titles-string '#{pane_title}'

set -g history-limit 100000
